<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b35">
  <meta name="description" content="剑网叁·江湖拾梦，二十门派与无相楼、五人同行、历代秘境与神兵铸造的像素放置江湖。">
  <title>江湖拾梦 · 剑网叁</title>
  <script>
    // Keep recovery available even if the game bundle or account configuration never loads.
    (() => {
      let failed = false;
      function reveal() {
        const box = document.getElementById('asset-recovery');
        if (box) box.hidden = false;
        else document.addEventListener('DOMContentLoaded', reveal, {once:true});
      }
      function onError(event) {
        const el = event.target;
        if ((el.tagName === 'SCRIPT' && el.defer && !el.src.endsWith('/support-config.js')) ||
            (el.tagName === 'LINK' && el.rel === 'stylesheet')) {
          failed = true;
          reveal();
        }
      }
      function retry(event) {
        if (event.target.id === 'asset-retry') location.reload();
      }
      const timer = setTimeout(reveal, 12000);
      window.addEventListener('error', onError, true);
      document.addEventListener('click', retry);
      window.JXBoot = {
        get failed() { return failed; },
        finish() {
          clearTimeout(timer);
          window.removeEventListener('error', onError, true);
          document.removeEventListener('click', retry);
        }
      };
    })();
  </script>
  <link rel="icon" type="image/png" href="assets/brand/jianghu-pixel-mark-v1.d4fb4dc1bfe2.webp">
  <link rel="stylesheet" href="game.4dd1d0cf7da3.css">
  <script defer src="account-config.js"></script>
  <script defer src="game.5c2d855434bb.js"></script>
  <script defer src="support-config.js"></script>
</head>
<body>
  <div id="app">
    <main class="jianghu-loading" aria-label="江湖拾梦载入中">
      <div class="loading-stage">
        <div class="loading-emblem">
          <span class="brand-mark" role="img" aria-label="江湖拾梦剑徽"></span>
        </div>
        <div id="asset-progress" role="progressbar" aria-label="正在打开江湖"><i></i></div>
        <div id="asset-recovery" hidden><span role="status">江湖入口尚未就绪</span><button type="button" class="btn" id="asset-retry">重新载入</button></div>
      </div>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-label="江湖详情"></dialog>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <noscript>请启用 JavaScript，以开启江湖历练。</noscript>
</body>
</html>
