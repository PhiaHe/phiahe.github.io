name: Publish verified Jianghu release archive

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: Temporary HTTPS URL for the public, verified release archive
        required: true
        type: string
      package_sha256:
        description: Exact SHA256 of the public archive
        required: true
        type: string
      expected_head:
        description: Exact master commit to advance without replacing other work
        required: true
        type: string
      expected_tree:
        description: Exact reviewed Git tree after adding the release files
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-verified-jianghu-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'PhiaHe/phiahe.github.io' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out master without persisting credentials
        uses: actions/checkout@v5
        with:
          ref: master
          persist-credentials: false

      - name: Verify archive, allowed files, exact source bytes and reviewed tree
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, re, subprocess, tarfile, urllib.parse, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          inputs = event['inputs']
          url = inputs['package_url']
          print('::add-mask::' + url, flush=True)
          expected_head = inputs['expected_head']
          expected_tree = inputs['expected_tree']
          digest = inputs['package_sha256']
          assert re.fullmatch('[0-9a-f]{40}', expected_head)
          assert re.fullmatch('[0-9a-f]{40}', expected_tree)
          assert re.fullmatch('[0-9a-f]{64}', digest)
          assert git('rev-parse', 'HEAD') == expected_head, 'Master changed before checkout'
          parsed = urllib.parse.urlsplit(url)
          assert parsed.scheme == 'https' and parsed.hostname and not parsed.username and not parsed.password
          assert parsed.hostname.endswith(('.tcb.qcloud.la', '.tcloudbaseapp.com', '.myqcloud.com', '.cloudbase.net')), 'Unrecognized archive host'
          try:
              with urllib.request.urlopen(url, timeout=180) as response:
                  assert response.geturl().startswith('https://')
                  raw = response.read(80 * 1024 * 1024 + 1)
          except Exception:
              raise RuntimeError('Archive download failed; temporary URL withheld') from None
          assert len(raw) <= 80 * 1024 * 1024
          assert hashlib.sha256(raw).hexdigest() == digest, 'Archive digest mismatch'
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as bundle:
              members = bundle.getmembers()
              names = [member.name for member in members]
              assert len(names) == len(set(names)), 'Duplicate archive member'
              assert all(member.isfile() for member in members), 'Only regular files are allowed'
              assert all(not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts and '\\' not in name for name in names)
              assert 'manifest.json' in names
              manifest = json.load(bundle.extractfile('manifest.json'))
              assert manifest['format'] == 1
              assert manifest['baseCommit'] == '45f6063d0a52012324863506483e32890131aad7'
              assert manifest['sourceCommit'] == '9825352d040e5bf4c4fc205ea4182c123aa34762'
              assert re.fullmatch('[0-9a-f]{40}', manifest['sourceTree'])
              files = manifest['files']
              assert len(files) == 85 and len({entry['path'] for entry in files}) == 85
              assert set(names) == {'manifest.json', *('files/' + entry['path'] for entry in files)}
              exact = {'public/brand/jianghu-pixel-mark-v1.png', 'public/jh/index.html', 'src/components/WorkCard.tsx', 'src/data/siteData.ts'}
              root = pathlib.Path.cwd().resolve()
              for entry in files:
                  name = entry['path']
                  assert name in exact or name.startswith('public/jianghu/')
                  assert not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts and '\\' not in name
                  assert not any(part.startswith('.') for part in pathlib.PurePosixPath(name).parts)
                  content = bundle.extractfile('files/' + name).read()
                  assert len(content) == entry['bytes'] and len(content) <= 8 * 1024 * 1024
                  assert hashlib.sha256(content).hexdigest() == entry['sha256']
                  blob = hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest()
                  assert blob == entry['gitBlobSha'], 'Git blob mismatch: ' + name
                  target = (root / name).resolve()
                  assert root in target.parents and not target.is_symlink()
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
              subprocess.check_call(['git', 'add', '--', *(entry['path'] for entry in files)])
              changed = set(git('diff', '--cached', '--name-only').splitlines())
              assert changed == {entry['path'] for entry in files}, 'Unexpected staged paths'
              assert git('write-tree') == expected_tree, 'Reviewed complete tree mismatch'
          print('Verified 85 public release files, archive SHA256, per-file hashes and exact Git tree.', flush=True)
          PY

      - name: Commit and advance master without force
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          current_head="$(gh api repos/PhiaHe/phiahe.github.io/git/ref/heads/master --jq .object.sha)"
          test "$current_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish verified Jianghu 4.6.1 game and short entry'
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth_header"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:master
          printf 'Published reviewed commit %s\n' "$(git rev-parse HEAD)"
